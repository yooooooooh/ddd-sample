name: Integration Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  integration-test:
    name: Integration Test with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: database

    defaults:
      run:
        working-directory: praha-challenge-ddd-template

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Setup
        uses: ./praha-challenge-ddd-template/.github/actions/setup

      - name: Run migrations
        run: pnpm migration:apply

      - name: Run integration tests
        run: pnpm test postgresql-student-repository.test.ts
